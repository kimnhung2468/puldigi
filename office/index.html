const veSoBinh = b => { const g = b.g, c = g.canvas; g.clearRect(0, 0, c.width, c.height); g.fillStyle = NAVY; g.textAlign = 'center'; g.font = `600 52px "IBM Plex Mono",Consolas,monospace`; g.fillText(b.ten, c.width / 2, 50); g.font = `700 60px "IBM Plex Mono",Consolas,monospace`; g.fillText(Math.round(b.pct) + '%', c.width / 2, 116); b.so.needsUpdate = true; b.da = Math.round(b.pct); };
nuoc.forEach(b => { const c = document.createElement('canvas'); c.width = 256; c.height = 128; b.g = c.getContext('2d'); b.so = new THREE.CanvasTexture(c); b.so.colorSpace = THREE.SRGBColorSpace; b.so.anisotropy = renderer.capabilities.getMaxAnisotropy(); const m = new THREE.Mesh(new THREE.PlaneGeometry(0.76, 0.38), new THREE.MeshBasicMaterial({ map: b.so, transparent: true, depthWrite: false, toneMapped: false })); m.rotation.x = -Math.PI / 2; m.position.set(b.x, 0.018, b.z + 0.46); scene.add(m); veSoBinh(b); });

// camera nhìn gần như từ trên xuống, nhìn thẳng như bản vẽ mặt bằng
let goc = +qs.get('goc') || 0, ngang = +qs.get('ngang') || 1, phong = 1, W = 1, H = 1, lx = 0, lz = 0, khoangCach = 40; const DICH = new THREE.Vector3();
const kep = (v, a, b) => Math.min(b, Math.max(a, v)), TANF = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
function datCam() {
  const k = 1 - 1 / phong, gx = 1 + 10 * Math.max(0, k), gz = 1 + 8 * Math.max(0, k); lx = kep(lx, -gx, gx); lz = kep(lz, -gz, gz);
  const a = W / H; khoangCach = Math.max(9.1 / TANF, 11.3 / (TANF * a)) / phong; const d = khoangCach; DICH.set(TAM.x + lx, 0, TAM.z + lz);
  cam.position.set(DICH.x + Math.sin(goc) * Math.cos(ngang) * d, Math.sin(ngang) * d, DICH.z + Math.cos(goc) * Math.cos(ngang) * d); cam.lookAt(DICH);

}
function coGian() { W = innerWidth; H = innerHeight; renderer.setSize(W, H); datCam(); }
addEventListener('resize', coGian); coGian();
const cv = renderer.domElement, tiaPhong = new THREE.Raycaster(), matSan = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), ngon = new Map(); let keo = null, batDau = null, kcNgon = 0, giua2 = null;
function diemSan(x, y) { tiaPhong.setFromCamera(new THREE.Vector2(x / W * 2 - 1, 1 - y / H * 2), cam); return tiaPhong.ray.intersectPlane(matSan, new THREE.Vector3()); }
function thuPhong(he, x = W / 2, y = H / 2) { const a = diemSan(x, y); phong = kep(phong * he, 0.6, 3.5); datCam(); const b = diemSan(x, y); if (a && b) { lx += a.x - b.x; lz += a.z - b.z; datCam(); } }
function veGiua() { goc = 0; ngang = 1; phong = 1; lx = lz = 0; datCam(); }
function diChuyen(dx, dy) { const k = 2 * khoangCach * TANF / H, c = Math.cos(goc), n = Math.sin(goc), t = k / Math.max(0.3, Math.sin(ngang)); lx += -dx * k * c - dy * t * n; lz += dx * k * n - dy * t * c; }
const haiNgon = () => { const [a, b] = [...ngon.values()]; return { d: Math.hypot(a.x - b.x, a.y - b.y), x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; };
cv.addEventListener('contextmenu', ev => ev.preventDefault());

  ngon.set(ev.pointerId, { x: ev.clientX, y: ev.clientY }); cv.setPointerCapture(ev.pointerId);
  if (ngon.size === 2) { const h = haiNgon(); kcNgon = h.d; giua2 = h; batDau = keo = null; return; }

});

  if (!diem) return;

$('nut-zoom').addEventListener('click', ev => { const z = ev.target.closest('[data-z]')?.dataset.z; if (z === 'to') thuPhong(1.25); if (z === 'nho') thuPhong(0.8); if (z === 'giua') veGiua(); });

let lanVe = 0; const dongHo = new THREE.Clock();
