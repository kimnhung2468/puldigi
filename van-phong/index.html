<script type="module">

const TUONG = [

  [0, 3.4, 15.6, 3.4, [3.7, 9.7, 11.5]], [4.6, 0, 4.6, 3.4], [10.6, 0, 10.6, 3.4], [15.6, 0, 15.6, 8, [6.8]],
  [14.2, 8, 20, 8], [14.2, 8, 14.2, 15, [9]], [3.4, 3.4, 3.4, 15, [5.2, 13.8]], [0, 9, 3.4, 9],

const CHU_SAN = [['Game lầu 9', 2.3, 2.15, '#fff'], ['Clip và showreel', 7.6, 2.15, NAVY], ['Góc nghỉ', 12.6, 2.14, NAVY], ['Wiki và kiến thức', 1.75, 7.75, NAVY, 0.26], ['Bản đồ video', 1.7, 11.9, NAVY, 0.3], ['Landing và web', 7.9, 9.05, NAVY], ['Lead và ứng dụng', 17.8, 3.6, NAVY], ['Kế hoạch và báo cáo', 17.1, 13.7, NAVY], ['Bàn của Nhung', 12.25, 12.55, NAVY]];
const CAO = 1.12, DAY = 0.17;

// sàn đá: vân đá, đèn hắt, bóng chân tường và tên phòng vẽ sẵn vào một tấm
const PX = 150;
const sanT = tex(20 * PX, 15 * PX, (g, W, H) => {

  for (let i = 0; i < 300; i++) { const x = rd() * W, y = rd() * H; g.strokeStyle = `rgba(92,96,110,${0.05 + rd() * 0.09})`; g.lineWidth = 1 + rd() * 2; g.beginPath(); g.moveTo(x, y); g.bezierCurveTo(x + rd() * 300 - 150, y + rd() * 200, x + rd() * 500 - 250, y + rd() * 300, x + rd() * 700 - 350, y + rd() * 400); g.stroke(); }
  g.strokeStyle = 'rgba(110,115,130,.13)'; g.lineWidth = 2; for (let x = 0; x <= 20; x += 1.6) { g.beginPath(); g.moveTo(x * PX, 0); g.lineTo(x * PX, H); g.stroke(); } for (let z = 0; z <= 15; z += 1.6) { g.beginPath(); g.moveTo(0, z * PX); g.lineTo(W, z * PX); g.stroke(); }

  });

});
const san = new THREE.Mesh(new THREE.PlaneGeometry(20, 15), new THREE.MeshStandardMaterial({ map: sanT, roughness: 0.32, metalness: 0.02 }));
san.rotation.x = -Math.PI / 2; san.position.set(10, 0, 7.5); san.receiveShadow = true; scene.add(san);

const denPhong = {};

// tường trắng, đỉnh navy

  const ds = cua.map(c => Array.isArray(c) ? c : [c, 1]); const ngang = z1 === z2; let a = ngang ? x1 : z1; const b = ngang ? x2 : z2;

cua(3.2, 3.47, true); cua(9.2, 3.47, true); cua(11, 3.47, true); cua(15.67, 6.3, false, 1); cua(14.27, 8.5, false, 1); cua(3.33, 4.7, false, -1);
[8.8, 11].forEach(x => { hop(0.1, 1.4, 0.16, x, 0, 15, NAVY); }); hop(2.3, 0.07, 0.16, 9.9, 1.36, 15, NAVY);
const led = phat('#FFF1D2', 1.15);
[5.1, 7.6, 10.1, 11.1, 13.1, 15.1, 16.1, 19.5].forEach(x => hop(0.018, 1, 0.01, x, 0.03, 0.09, null, { mat: led, ns: true }));
function tranh(x, z, w, h, ve) { hop(w + 0.05, h + 0.05, 0.02, x, 0.72, z, NAVY, { ns: true }); hop(w, h, 0.012, x, 0.745, z + 0.012, null, { ns: true, mat: matT(96, 96 * h / w | 0, ve, 0.6) }); }

tranh(7.3, 0.09, 0.55, 0.42, hinhNavy); tranh(13.3, 0.09, 0.55, 0.42, hinhNhe); tranh(17.2, 0.09, 0.55, 0.42, hinhNavy); tranh(18.3, 0.09, 0.55, 0.42, hinhNhe);

function cay(x, z, s = 1, chau = TRANG) {
